<!DOCTYPE html>
<html>
<head>
    <title>Simple Proxy</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        input {
            width: 60%;
            padding: 12px;
            border-radius: 10px;
            border: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        iframe {
            width: 100%;
            height: 80vh;
            margin-top: 20px;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <h1>Educational Proxy</h1>

    <input type="text" id="urlBox" placeholder="https://example.com">
    <button onclick="openSite()">Open</button>

    <iframe id="frame"></iframe>

    <script>
        function openSite() {
            let url = document.getElementById("urlBox").value;

            if (!url.startsWith("http")) {
                url = "https://" + url;
            }

            document.getElementById("frame").src = "/proxy?url=" + encodeURIComponent(url);
        }
    </script>

</body>
</html>
